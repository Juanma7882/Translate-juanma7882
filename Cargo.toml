[workspace]
resolver = "3"
members = ["crates/tr-core", "crates/tr-models", "crates/tr-adapters", "crates/tr-engine", "crates/tr-bindings"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

# Versiones verificadas el 2026-10-27 (activas, licencia MIT/Apache-2.0).
[workspace.dependencies]
thiserror = "2.0.21"
crossbeam-channel = "0.5.17"
lru = "0.19.0"
# napi-rs: MIT, actualizados en 2026-10, MSRV 1.88.
napi = "3.15.0"
napi-derive = "3.6.13"
napi-build = "2.6.0"

# Hito 2 (verificadas 2026-10-27: activas, MIT/Apache-2.0).
# `oar-ocr` exige rustc 1.95 y fija `ort = "=2.0.0-rc.13"`: toda la ML del workspace usa esa versión.
xcap = "0.9.8"
oar-ocr = { version = "=0.10.2", default-features = false, features = ["simd"] }
# Sin `tls-native` (arrastra openssl-sys y exige libssl-dev): ver docs/adr/0003-ocr-translation-engines.md.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "copy-dylibs", "download-binaries", "tls-rustls"] }
sentencepiece-model = "0.1.4"
spm_precompiled = "0.1.4"
ndarray = "0.17.2"
image = { version = "0.25.10", default-features = false }
ureq = "3.5.0"
sha2 = "0.11.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Hito 3 (verificadas 2026-10-27: activas, MIT/Apache-2.0).
# `realfft` (sobre RustFFT, Rust puro) para el espectrograma de Whisper.
realfft = "=3.5.1"
# Captura de audio del sistema: `cpal` (WASAPI loopback en Windows, CoreAudio en macOS) y, en Linux,
# `pulseaudio` (cliente PulseAudio/PipeWire en Rust puro, sin libpulse-dev ni libasound2-dev).
cpal = "=0.18.2"
pulseaudio = "=0.3.2"
# Captura por aplicacion en Windows (ver docs/adr/0008-audio-por-aplicacion.md; verificadas 2026-10-28:
# wasapi 0.26.0 MIT, mantenida por HEnquist, usa `windows` 0.62.2 ya presente por cpal; sysinfo 0.39.6 MIT, MSRV 1.95).
wasapi = "=0.26.0"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }

tr-core = { path = "crates/tr-core" }
tr-models = { path = "crates/tr-models" }
tr-adapters = { path = "crates/tr-adapters", default-features = false }
tr-engine = { path = "crates/tr-engine" }

# `unsafe` se prohíbe con #![forbid(unsafe_code)] en tr-core y tr-engine; las macros de napi
# generan código unsafe, así que tr-bindings no puede heredar un forbid global.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Nada de contenido a logs: imprimir está prohibido (ver docs/adr/0002-architecture.md).
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
